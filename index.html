const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const K="hk1016.key";
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromPw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  try{const k=localStorage.getItem(K);if(k){const key=await crypto.subtle.importKey("raw",u(k),"AES-GCM",false,["decrypt"]);await open(key);return;}}catch(e){try{localStorage.removeItem(K)}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const e=document.getElementById("e"),b=document.getElementById("go");
  e.textContent="";b.textContent="여는 중…";b.disabled=true;
  try{
    const key=await fromPw(document.getElementById("pw").value);
    const raw=await crypto.subtle.exportKey("raw",key);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
    if(document.getElementById("rm").checked){try{localStorage.setItem(K,btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(_){}}
    await open(key);
  }catch(err){e.textContent="비밀번호가 맞지 않아요";b.textContent="열기";b.disabled=false;}
});
